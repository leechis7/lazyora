name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, vet and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go.sum
      - name: Test with race detector
        run: make test
      - name: Vet
        run: make check
      - name: Build Linux and Windows AMD64/ARM64
        run: make build-all
      - name: Check executable version
        run: ./bin/lazyora-linux-amd64 --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: bin/lazyora-*
          if-no-files-found: error
          retention-days: 7

  windows-smoke:
    name: Windows AMD64 executable
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go.sum
      - name: Build and run version command
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go build -trimpath -o bin/lazyora-windows-amd64.exe ./cmd/lazyora
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\bin\lazyora-windows-amd64.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
